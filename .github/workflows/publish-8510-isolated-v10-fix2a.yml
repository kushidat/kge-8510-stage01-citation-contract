name: Publish 8510 isolated V10 FIX2A source-only prerelease
on:
  push:
    branches:
      - 'release/8510-isolated-v10-fix2a-20261106'
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'kushidat/kge-8510-stage01-citation-contract'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@v4
      - name: Verify source ZIP identity
        shell: bash
        run: |
          set -euo pipefail
          echo "649ecc8940798d5e084e88a1055a1b71276dec3bebe69f5e8cd17110c7e75958  releases/8510/8510-isolated-v10-fix2a-20261106/KGE_8510_ISOLATED_V10_FIX2A_SOURCE_20261106.zip" | sha256sum -c -
      - name: Publish exact source asset as a GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='8510-isolated-v10-fix2a-20261106'
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Existing release retained; not overwriting"
            exit 0
          fi
          gh release create "$TAG" \
            releases/8510/8510-isolated-v10-fix2a-20261106/KGE_8510_ISOLATED_V10_FIX2A_SOURCE_20261106.zip \
            --target "$GITHUB_SHA" \
            --title "8510 isolated V10 + FIX2A — source-only prerelease" \
            --notes-file releases/8510/8510-isolated-v10-fix2a-20261106/RELEASE_NOTES.md \
            --prerelease
          gh release view "$TAG" --json url,tagName,isPrerelease
