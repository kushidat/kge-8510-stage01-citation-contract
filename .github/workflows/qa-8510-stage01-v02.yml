name: 8510 Stage01 V02 release QA (pre-release archive)
on:
  push:
    branches:
      - 'qa/8510-release-certification-20261105'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KGE_STAGE01_V02_ENABLED: 'NO'
      APP_USER_ID: ''
      ALLOW_SERVER_OPENAI_KEY: 'false'
      OPENAI_API_KEY: ''
      KEY_ENCRYPTION_SECRET: ''
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated preview test dependencies
        run: python -m pip install 'streamlit>=1.45,<1.60' 'pandas>=2.2,<3.0' 'plotly>=5,<7' 'requests>=2.31,<3' 'openai>=1.0,<4' 'cryptography>=42,<50'
      - name: Fetch published artifact and test authenticity, source syntax, disabled UI, HTTP boot and exit
        run: |
          set -Eeuo pipefail
          python qa/verify_published_stage01_v02.py | tee qa_verification_stdout.txt
      - name: Build disabled-preview QA candidate with SHA manifest and manual
        run: |
          set -Eeuo pipefail
          python qa/build_disabled_preview_candidate.py
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import hashlib,csv,io,zlib
          p=Path("candidate/8510_STAGE01_V02_DISABLED_PREVIEW_QA_CANDIDATE.zip")
          with ZipFile(p) as z:
              assert z.testzip() is None
              names=z.namelist()
              assert len(names)==len(set(names))
              m=list(csv.DictReader(io.StringIO(z.read("MANIFEST_SHA256_SIZE_CRC.tsv").decode()), delimiter="\t"))
              assert len(m)==len(names)-1
              for item in m:
                  b=z.read(item["path"])
                  assert len(b)==int(item["size_bytes"])
                  assert hashlib.sha256(b).hexdigest()==item["sha256"]
                  assert format(zlib.crc32(b)&0xffffffff,"08x")==item["crc32_hex"]
          print("CANDIDATE_CRC_MANIFEST_SHA_SIZE=PASS",len(m))
          PY
      - name: Candidate launcher end-to-end start, HTTP health and stop
        run: |
          set -Eeuo pipefail
          TEMP_DIR="$(mktemp -d)"
          python -m zipfile -e candidate/8510_STAGE01_V02_DISABLED_PREVIEW_QA_CANDIDATE.zip "$TEMP_DIR"
          python -m venv --system-site-packages "$TEMP_DIR/.preview_venv"
          bash -n "$TEMP_DIR/RUN_DISABLED_PREVIEW.command"
          PORT="$(python -c 'import socket; s=socket.socket();s.bind(("127.0.0.1",0));print(s.getsockname()[1]);s.close()')"
          bash "$TEMP_DIR/RUN_DISABLED_PREVIEW.command" "$PORT" > candidate_launcher_stdout.txt 2>&1 &
          PID=$!
          cleanup() {
            if kill -0 "$PID" 2>/dev/null; then
              kill -TERM "$PID" 2>/dev/null || true
              wait "$PID" || true
            fi
          }
          trap cleanup EXIT
          OK=0
          for i in $(seq 1 60); do
            if curl -fsS --max-time 1 "http://127.0.0.1:$PORT/_stcore/health" | grep -q 'ok'; then
              OK=1; break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 1
          done
          test "$OK" -eq 1
          echo "CANDIDATE_LAUNCHER_HTTP_START=PASS"
          kill -TERM "$PID"
          for i in $(seq 1 20); do
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 0.2
          done
          if kill -0 "$PID" 2>/dev/null; then
            echo "CANDIDATE_LAUNCHER_STOP=FAIL" >&2
            exit 2
          fi
          wait "$PID" || true
          echo "CANDIDATE_LAUNCHER_STOP=PASS"
          trap - EXIT
      - name: Browser-level disabled GUI smoke (Chromium)
        run: |
          set -Eeuo pipefail
          python -m pip install 'playwright>=1.50,<1.60'
          python -m playwright install chromium
          python qa/browser_ui_smoke.py
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 8510-stage01-v02-browser-evidence
          path: |
            qa_browser_preview.png
            qa_browser_stdout.log
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve build candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 8510-stage01-v02-disabled-preview-qa-candidate
          path: candidate/8510_STAGE01_V02_DISABLED_PREVIEW_QA_CANDIDATE.zip
          if-no-files-found: error
          retention-days: 30
      - name: Preserve QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage01-v02-qa-logs
          path: |
            qa_verification_stdout.txt
            qa_verification.json
            streamlit_server.log
          if-no-files-found: ignore
          retention-days: 30
